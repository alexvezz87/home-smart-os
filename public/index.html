<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Home Smart OS — Digital Twin &amp; Energy Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/jsmpeg.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0b1120; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card:hover {
      border-color: rgba(99, 102, 241, 0.25);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col pb-16 sm:pb-0 select-none">

  <!-- Fullscreen Auth / Tablet Kiosk Lock Overlay -->
  <div id="auth-modal" class="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-xl hidden items-center justify-center p-4 transition-opacity duration-300">
    <div class="glass-card max-w-md w-full rounded-3xl p-6 sm:p-8 shadow-2xl border border-slate-800 text-center relative overflow-hidden">
      <div class="absolute -top-20 -left-20 w-40 h-40 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-20 -right-20 w-40 h-40 bg-sky-500/20 rounded-full blur-3xl pointer-events-none"></div>

      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-sky-500 flex items-center justify-center text-white text-2xl mx-auto shadow-lg shadow-indigo-500/30 mb-4">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h2 class="text-2xl font-black text-white tracking-tight">Home Smart OS</h2>
      <p class="text-xs text-slate-400 mt-1 mb-5">Accesso protetto • Tablet Kiosk &amp; Google OAuth2</p>

      <!-- Errore PIN -->
      <div id="auth-error-banner" class="hidden mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs text-left flex items-start gap-2">
        <i class="fa-solid fa-triangle-exclamation mt-0.5 text-rose-400 shrink-0"></i>
        <span id="auth-error-msg">PIN errato</span>
      </div>

      <!-- Tastierino PIN Kiosk -->
      <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 mb-5">
        <div class="flex items-center justify-between mb-2 text-xs">
          <span class="font-bold text-slate-300 flex items-center gap-1.5">
            <i class="fa-solid fa-tablet-screen text-indigo-400"></i> Tablet Kiosk (PIN)
          </span>
          <span class="text-[10px] text-slate-400 font-mono">Sessione 90 giorni</span>
        </div>

        <div id="pin-display" class="flex justify-center gap-3 my-3">
          <span class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600 transition-all bg-transparent"></span>
          <span class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600 transition-all bg-transparent"></span>
          <span class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600 transition-all bg-transparent"></span>
          <span class="pin-dot w-4 h-4 rounded-full border-2 border-slate-600 transition-all bg-transparent"></span>
        </div>

        <div class="grid grid-cols-3 gap-2 max-w-[260px] mx-auto mt-4">
          <button type="button" onclick="handlePinDigit('1')" class="h-12 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-lg font-bold text-white transition-all">1</button>
          <button type="button" onclick="handlePinDigit('2')" class="h-12 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-lg font-bold text-white transition-all">2</button>
          <button type="button" onclick="handlePinDigit('3')" class="h-12 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-lg font-bold text-white transition-all">3</button>
          <button type="button" onclick="handlePinDigit('4')" class="h-12 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-lg font-bold text-white transition-all">4</button>
          <button type="button" onclick="handlePinDigit('5')" class="h-12 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-lg font-bold text-white transition-all">5</button>
          <button type="button" onclick="handlePinDigit('6')" class="h-12 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-lg font-bold text-white transition-all">6</button>
          <button type="button" onclick="handlePinDigit('7')" class="h-12 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-lg font-bold text-white transition-all">7</button>
          <button type="button" onclick="handlePinDigit('8')" class="h-12 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-lg font-bold text-white transition-all">8</button>
          <button type="button" onclick="handlePinDigit('9')" class="h-12 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-lg font-bold text-white transition-all">9</button>
          <button type="button" onclick="handlePinClear()" class="h-12 rounded-xl bg-rose-950/40 hover:bg-rose-900/40 border border-rose-500/20 active:scale-95 text-sm font-bold text-rose-300 transition-all"><i class="fa-solid fa-delete-left"></i></button>
          <button type="button" onclick="handlePinDigit('0')" class="h-12 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-lg font-bold text-white transition-all">0</button>
          <button type="button" onclick="submitKioskPin()" class="h-12 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-sm font-bold text-white transition-all"><i class="fa-solid fa-arrow-right"></i></button>
        </div>
      </div>

      <div class="relative flex items-center justify-center my-4">
        <div class="border-t border-slate-800 w-full"></div>
        <span class="bg-slate-900 px-3 text-[11px] font-semibold text-slate-400 uppercase tracking-wider absolute">oppure</span>
      </div>

      <a href="/api/auth/google" class="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-xl bg-white hover:bg-slate-100 text-slate-900 font-bold text-sm transition-all shadow-md active:scale-95">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Accedi con Google (Whitelist)
      </a>
    </div>
  </div>

  <!-- Contextual Device Drawer / Bottom Sheet -->
  <div id="device-drawer" class="fixed inset-y-0 right-0 sm:w-[480px] w-full z-50 bg-slate-950/95 backdrop-blur-2xl border-l border-slate-800/80 shadow-2xl p-6 overflow-y-auto transform transition-transform duration-300 translate-x-full hidden flex-col">
    <div id="device-drawer-content" class="h-full flex flex-col"></div>
  </div>

  <!-- Fullscreen Camera Theater / Maxi-Player Modal -->
  <div id="camera-theater-modal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-xl hidden items-center justify-center p-2 sm:p-4 md:p-6 transition-all duration-300">
    <div id="camera-theater-content" class="w-full flex items-center justify-center"></div>
  </div>

  <!-- Top Navigation Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/80 sticky top-0 z-40 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Brand & Home Title -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-sky-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
          <i class="fa-solid fa-house-signal text-lg"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base sm:text-lg font-bold text-white tracking-tight" id="home-name">Casetta</h1>
            <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
              MCP Live
            </span>
          </div>
          <p class="text-[11px] text-slate-400 hidden sm:block">Digital Twin &amp; Energy Intelligence</p>
        </div>
      </div>

      <!-- Desktop / Tablet: 3 Macro-Areas Navigation Buttons -->
      <div class="hidden sm:flex items-center gap-2">
        <button data-area="home" class="nav-area-btn px-4 py-2 rounded-xl text-xs font-bold bg-indigo-600 text-white shadow-md shadow-indigo-600/30 transition-all flex items-center gap-2">
          <i class="fa-solid fa-house"></i>
          <span>La Mia Casa</span>
        </button>
        <button data-area="energy" class="nav-area-btn px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800/80 text-slate-400 hover:text-slate-200 hover:bg-slate-700/60 transition-all flex items-center gap-2">
          <i class="fa-solid fa-bolt-lightning text-amber-400"></i>
          <span>Consumi &amp; Energia</span>
        </button>
        <button data-area="admin" class="nav-area-btn px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800/80 text-slate-400 hover:text-slate-200 hover:bg-slate-700/60 transition-all flex items-center gap-2">
          <i class="fa-solid fa-screwdriver-wrench text-sky-400"></i>
          <span>Amministrazione</span>
        </button>
      </div>

      <!-- Quick Metrics & Actions -->
      <div class="flex items-center gap-2.5">
        <!-- Security Mode -->
        <div id="security-badge" onclick="cycleSecurityMode()" class="cursor-pointer hidden md:flex items-center gap-1.5 bg-slate-800/80 hover:bg-slate-700/80 text-slate-200 border border-slate-700/60 px-3 py-1.5 rounded-xl text-xs font-semibold shadow-inner transition-colors" title="Clicca per cambiare modalità sicurezza">
          <i class="fa-solid fa-shield-halved text-rose-400"></i>
          <span id="stat-sec-mode">A Casa</span>
        </div>

        <!-- Potenza Totale -->
        <div id="energy-badge" class="flex items-center gap-1.5 bg-amber-950/60 text-amber-300 border border-amber-500/30 px-3 py-1.5 rounded-xl text-xs font-semibold shadow-inner" title="Potenza totale istantanea prese">
          <i class="fa-solid fa-bolt text-amber-400"></i>
          <span id="stat-power">0 W</span>
        </div>

        <!-- Master Off Button -->
        <button onclick="triggerMasterOff()" class="p-2.5 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 border border-rose-500/30 transition-all active:scale-95" title="Spegni tutto">
          <i class="fa-solid fa-power-off text-xs"></i>
        </button>

        <!-- Refresh Button -->
        <button onclick="loadDashboard()" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors border border-slate-700/50 active:scale-95" title="Aggiorna dati">
          <i class="fa-solid fa-rotate-right text-xs" id="refresh-icon"></i>
        </button>

        <!-- User Profile Badge & Logout -->
        <div class="hidden sm:flex items-center gap-2 bg-slate-800/80 border border-slate-700/60 px-2.5 py-1.5 rounded-xl text-xs shadow-inner">
          <i class="fa-solid fa-user-shield text-indigo-400"></i>
          <span id="user-display" class="font-medium text-slate-300 max-w-[120px] truncate">Admin</span>
          <button type="button" onclick="logoutNow()" class="text-slate-400 hover:text-rose-400 p-0.5 transition-colors active:scale-95" title="Disconnetti">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </div>

    </div>
  </header>

  <!-- Main Workspace Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 flex-1 w-full space-y-5">

    <!-- AI Command Bar -->
    <div class="glass-card rounded-2xl p-3.5 shadow-xl">
      <form id="assistant-form" class="relative flex items-center">
        <div class="absolute left-4 text-indigo-400 text-base">
          <i class="fa-solid fa-wand-magic-sparkles animate-pulse"></i>
        </div>
        <input
          type="text"
          id="assistant-input"
          placeholder="Chiedi o comanda alla casa (es: 'Accendi presa cucina', 'Temperatura salone', 'Spegni tutto')..."
          class="w-full bg-slate-900/90 text-slate-100 placeholder-slate-400 pl-11 pr-24 py-3 rounded-xl border border-slate-700/70 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-xs sm:text-sm transition-all"
        />
        <button
          type="submit"
          class="absolute right-2 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold shadow-md shadow-indigo-600/30 transition-all flex items-center gap-1.5"
        >
          <span>Invia</span>
          <i class="fa-solid fa-paper-plane text-[10px]"></i>
        </button>
      </form>

      <!-- Risposta Assistente -->
      <div id="assistant-response-box" class="hidden mt-3 p-3 rounded-xl bg-indigo-950/40 border border-indigo-500/30 text-xs flex items-start gap-2.5">
        <i class="fa-solid fa-comment-dots text-indigo-400 mt-0.5"></i>
        <div id="assistant-response-text" class="text-slate-200"></div>
      </div>
    </div>

    <!-- MACRO-AREA 1: 🏠 La Mia Casa (Digital Twin Floorplan) -->
    <section id="area-home">
      <div id="floorplan-container"></div>
    </section>

    <!-- MACRO-AREA 2: ⚡ Consumi & Energia (Energy Intelligence) -->
    <section id="area-energy" class="hidden"></section>

    <!-- MACRO-AREA 3: ⚙️ Amministrazione & Hub (Diagnostica & Gestione) -->
    <section id="area-admin" class="hidden"></section>

  </main>

  <!-- Mobile Bottom Navigation Bar (Fissa su smartphone) -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 flex sm:hidden">
    <button data-area="home" class="mobile-nav-btn flex-1 py-2.5 text-indigo-400 flex flex-col items-center justify-center text-[10px] font-bold border-t-2 border-indigo-500 bg-slate-900/90 transition-all">
      <i class="fa-solid fa-house text-base mb-0.5"></i>
      <span>Casa</span>
    </button>
    <button data-area="energy" class="mobile-nav-btn flex-1 py-2.5 text-slate-400 hover:text-slate-200 flex flex-col items-center justify-center text-[10px] font-medium border-t-2 border-transparent transition-all">
      <i class="fa-solid fa-bolt-lightning text-base mb-0.5 text-amber-400"></i>
      <span>Consumi</span>
    </button>
    <button data-area="admin" class="mobile-nav-btn flex-1 py-2.5 text-slate-400 hover:text-slate-200 flex flex-col items-center justify-center text-[10px] font-medium border-t-2 border-transparent transition-all">
      <i class="fa-solid fa-screwdriver-wrench text-base mb-0.5 text-sky-400"></i>
      <span>Admin</span>
    </button>
  </nav>

  <!-- Script Modulari Frontend -->
  <script src="/js/device-sheet.js"></script>
  <script src="/js/camera-theater.js"></script>
  <script src="/js/floorplan.js"></script>
  <script src="/js/drag-editor.js"></script>
  <script src="/js/energy.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
